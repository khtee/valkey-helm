suite: sentinel configuration
templates:
  - templates/haproxy-deployment.yaml
  - templates/haproxy-service.yaml
  - templates/haproxy-configmap.yaml
tests:
  - it: should fail when haproxy is enabled but sentinel is disabled
    set:
      haproxy.enabled: true
      replica.enabled: true
      replica.persistence.size: "5Gi"
      replica.sentinel.enabled: false
    template: templates/haproxy-deployment.yaml
    asserts:
      - failedTemplate:
          errorPattern: "Haproxy requires replica mode and sentinel to handle incompatible sentinel clients usescases."

  - it: should not create haproxy Deployment when replica is disabled (default)
    set:
      haproxy.enabled: true
      replica.enabled: false
    template: templates/haproxy-deployment.yaml
    asserts:
      - failedTemplate:
          errorPattern: "Haproxy requires replica mode and sentinel to handle incompatible sentinel clients usescases."

  - it: should create haproxy Deployment when haproxy is enabled
    set:
      replica.enabled: true
      replica.persistence.size: "5Gi"
      replica.sentinel.enabled: true
      haproxy.enabled: true
      haproxy.replicas: 3
    template: templates/haproxy-deployment.yaml
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: RELEASE-NAME-valkey-haproxy
      - equal:
          path: spec.replicas
          value: 3
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 6379
      - equal:
          path: spec.template.spec.containers[0].ports[1].containerPort
          value: 6380

  - it: should create haproxy Service when haproxy is enabled
    set:
      replica.enabled: true
      replica.persistence.size: "5Gi"
      replica.sentinel.enabled: true
      haproxy.enabled: true
    template: templates/haproxy-service.yaml
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: haproxy
      - equal:
          path: spec.selector["app.kubernetes.io/component"]
          value: haproxy
      - equal:
          path: metadata.name
          value: RELEASE-NAME-valkey-haproxy
      - equal:
          path: spec.ports[0].port
          value: 6379
      - equal:
          path: spec.ports[1].port
          value: 6380

  - it: should create haproxy ConfigMap when haproxy is enabled
    set:
      replica.enabled: true
      replica.persistence.size: "5Gi"
      replica.sentinel.enabled: true
      haproxy.enabled: true
    template: templates/haproxy-configmap.yaml
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: RELEASE-NAME-valkey-haproxy
      - exists:
          path: data["haproxy.cfg"]
      - exists:
          path: data["sentinel-watcher.sh"]

  - it: should use custom haproxy replicas count
    set:
      replica.enabled: true
      replica.persistence.size: "5Gi"
      replica.sentinel.enabled: true
      haproxy.enabled: true
      haproxy.replicas: 4
    template: templates/haproxy-deployment.yaml
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.replicas
          value: 4

  - it: should use custom haproxy port
    set:
      replica.enabled: true
      replica.persistence.size: "5Gi"
      replica.sentinel.enabled: true
      haproxy.enabled: true
      haproxy.service.ports: 
        - name: valkey-write
          port: 6389
          targetPort: 6389
        - name: valkey-read
          port: 6390
          targetPort: 6390
    template: templates/haproxy-deployment.yaml
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 6389
      - equal:
          path: spec.template.spec.containers[0].ports[1].containerPort
          value: 6390

  - it: should use emptyDir
    set:
      replica.enabled: true
      replica.persistence.size: "5Gi"
      replica.sentinel.enabled: true
      haproxy.enabled: true
    template: templates/haproxy-deployment.yaml
    asserts:
      - isKind:
          of: Deployment
      - contains:
          path: spec.template.spec.volumes
          content:
            name: haproxy-socket
            emptyDir: {}

  - it: should set correct service type and nodePort
    set:
      replica.enabled: true
      replica.persistence.size: "5Gi"
      replica.sentinel.enabled: true
      haproxy.enabled: true
      haproxy.service.type: NodePort
      haproxy.service.ports:
        - name: valkey-write
          port: 6389
          targetPort: 6389
          nodePort: 31379
        - name: valkey-read
          port: 6390
          targetPort: 6390
          nodePort: 31380
    template: templates/haproxy-service.yaml
    asserts:
      - isKind:
          of: Service
      - equal:
          path: spec.type
          value: NodePort
      - equal:
          path: spec.ports[0].nodePort
          value: 31379
      - equal:
          path: spec.ports[1].nodePort
          value: 31380

  - it: should include haproxy component label
    set:
      replica.enabled: true
      replica.persistence.size: "5Gi"
      replica.sentinel.enabled: true
      haproxy.enabled: true
    template: templates/haproxy-deployment.yaml
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: haproxy
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/component"]
          value: haproxy
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/component"]
          value: haproxy

  - it: should apply resources when configured
    set:
      replica.enabled: true
      replica.persistence.size: "5Gi"
      replica.sentinel.enabled: true
      haproxy.enabled: true
      haproxy.resources:
        limits:
          cpu: 200m
          memory: 256Mi
        requests:
          cpu: 100m
          memory: 128Mi
    template: templates/haproxy-deployment.yaml
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: 200m
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 256Mi

  - it: should apply resources for sentinelWatcher when configured 
    set:
      replica.enabled: true
      replica.persistence.size: "5Gi"
      replica.sentinel.enabled: true
      haproxy.enabled: true
      haproxy.sentinelWatcher.resources:
        limits:
          cpu: 200m
          memory: 256Mi
        requests:
          cpu: 100m
          memory: 128Mi
    template: templates/haproxy-deployment.yaml
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.template.spec.containers[1].resources.requests.cpu
          value: 100m
      - equal:
          path: spec.template.spec.containers[1].resources.requests.memory
          value: 128Mi